name: Bug report
description: Report a reproducible behavior or recovery failure.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: Search existing open/closed tickets first. Use private vulnerability reporting for security issues. Do not upload .malt, provider homes, pairing codes or credentials.
  - type: input
    id: related
    attributes:
      label: Existing or related tickets
      description: Link possible duplicates and explain what is distinct.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include a minimal reproduction and the user-visible impact.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized evidence
      description: MALT commit, OS, Node version, native/container mode and attached/managed/browser session. Include only relevant sanitized output.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable fix
      description: What observable checks would demonstrate that this is fixed?
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: I removed credentials, pairing codes and private project state from this report.
          required: true
