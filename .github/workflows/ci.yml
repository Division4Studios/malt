# Continuous integration for Agent Mesh.
#
# `check` runs the full quality gate (typecheck, lint with zero warnings,
# formatting, tests) on every supported operating system. `docker` builds the
# image and runs the end-to-end Compose smoke test on Linux.
name: Verify MALT
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:docker
  quality-gate:
    name: Quality gate
    if: always()
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform and container check
        env:
          CHECK: ${{ needs.check.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$CHECK" = success && test "$DOCKER" = success
