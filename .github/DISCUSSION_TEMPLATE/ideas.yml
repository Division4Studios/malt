body:
  - type: markdown
    attributes:
      value: Search related issues and discussions first. Share the outcome you want; a full design is not required. Never include credentials, pairing codes or private .malt state. Security reports belong in private vulnerability reporting.
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would this enable?
    validations:
      required: true
  - type: textarea
    id: prior
    attributes:
      label: Related work and alternatives
      description: Link existing issues/discussions and explain what is distinct.
  - type: textarea
    id: scope
    attributes:
      label: Smallest verifiable first slice
