<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../web/style.css" />
<main id="content"></main>
<form id="editor-form"><label for="editor-body">Reason</label><textarea id="editor-body"></textarea></form>
<pre id="result">PENDING</pre>
<script type="module">
  import { triagePanel, triageDialog } from '../../web/dist/triage-ui.js';
  import { recoveryPanel } from '../../web/dist/recovery-ui.js';
  import { resetConnectionFields } from '../../web/dist/organization-ui.js';
  const result = document.querySelector('#result');
  const check = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  try {
    const task = {
      id: '00000000-0000-4000-8000-000000000001',
      version: 7,
      issue: 13,
      title: 'Repair source inspection',
      phase: 'blocked',
      developer: 'developer-1',
      pr: 3,
      prUrl: 'https://github.com/fixture/app/pull/3',
      merge: null,
      error:
        '# Review access blocked\n\n**Cause:** missing claim.\n- Restore read-only scope\n- Rerun independent QA\n\n`FACTORY_GATED`\n<img src=x onerror="window.injected=true">',
    };
    const state = {
      project: { id: 'fixture' },
      factory: {
        active: true,
        tasks: [task],
        jobs: [],
        triage: [],
        settings: { providers: { codex: { budgetTokens: 1, reservationTokens: 1 } } },
        capacities: [
          {
            provider: 'codex',
            usedTokens: 2,
            reservedTokens: 0,
            resetAt: Date.now() + 60000,
            cooldownUntil: Date.now() + 60000,
          },
        ],
      },
      github: { connection: { repository: 'fixture/app' } },
    };
    let selected;
    const actions = {
      triage: (item, action) => {
        selected = { item, action };
      },
    };
    const content = document.querySelector('#content');
    content.append(triagePanel(state, actions));
    const card = content.querySelector('.triage-card');
    check(card.querySelector('.triage-signal').textContent === '\u{203A}', 'asymmetric open/closed disclosure signal');
    card.open = true;
    check(content.querySelectorAll('.triage-action').length === 8, 'eight explicit actions');
    check(
      content.querySelector('a').getAttribute('href') === 'https://github.com/fixture/app/issues/13',
      'connected issue reference',
    );
    const buttons = [...content.querySelectorAll('button')];
    buttons.find((button) => button.textContent === 'Ask the lead').click();
    check(selected.action === 'investigate' && selected.item.id === task.id, 'exact task and action forwarded');
    check(
      buttons.find((button) => button.textContent === 'Verify merged main').disabled,
      'unmerged verification gated',
    );
    const sizeButton = buttons.find((button) => button.textContent === 'Approve this size exception');
    check(sizeButton.disabled, 'absent measurement cannot be approved');
    const gate = { head: 'exact', base: 'base', lines: 701, files: 9 };
    const blocked = triagePanel(
      { ...state, factory: { ...state.factory, tasks: [{ ...task, publicationGate: gate }] } },
      actions,
    );
    check(
      ![...blocked.querySelectorAll('button')].find((button) => button.textContent === 'Approve this size exception')
        .disabled,
      'blocked exact measurement can request approval',
    );
    const publishing = triagePanel(
      {
        ...state,
        factory: {
          ...state.factory,
          tasks: [
            { ...task, phase: 'publishing', publicationGate: gate, sizeApproval: { ...gate, reason: 'Approved' } },
          ],
        },
      },
      actions,
    );
    check(
      [...publishing.querySelectorAll('button')].find((button) => button.textContent === 'Approve this size exception')
        .disabled,
      'publication retry cannot request another size approval',
    );
    let resumed;
    const recovery = recoveryPanel(
      {
        ...state,
        factory: {
          ...state.factory,
          features: [],
          objectiveQueue: { existingOnly: true, order: ['objective'], revision: 8 },
        },
      },
      {
        ...actions,
        queue: (...args) => {
          resumed = args;
        },
      },
    );
    recovery.querySelector('button').click();
    check(resumed[3] === false && resumed[2] === 8, 'return to objective dispatch explicitly releases clearance');
    const editor = triageDialog(task, 'repair');
    const request = editor.action.input('Fix the cause');
    check(
      request.expectedVersion === 7 && request.action === 'repair' && request.taskId === task.id,
      'fenced editor request',
    );
    check(
      content.textContent.includes('scheduling budget exhausted') && content.textContent.includes('provider cooldown'),
      'dispatch admission diagnostics retained',
    );
    check(
      triageDialog(task, 'repair').action.input('Fix the cause').requestId === request.requestId,
      'uncertain retry keeps identity',
    );
    check(editor.action.input('Different intent').requestId !== request.requestId, 'changed payload gets new identity');
    const adoption = triageDialog(task, 'adopt_merge');
    adoption.description.mount();
    const commit = document.querySelector('#triage-merge-commit');
    check(commit.labels[0].textContent === 'External merge commit (full SHA)', 'native accessible commit field');
    commit.focus();
    check(document.activeElement === commit, 'commit field is focusable');
    for (const invalid of ['', 'main', 'abc', 'g'.repeat(40), 'a'.repeat(41)]) {
      commit.value = invalid;
      let rejected = false;
      try {
        adoption.action.input('Verified scope');
      } catch {
        rejected = true;
      }
      check(rejected, `invalid commit rejected: ${invalid}`);
    }
    commit.value = 'a'.repeat(40);
    const adopted = adoption.action.input('Verified scope');
    check(
      adopted.mergeCommit === commit.value && adopted.action === 'adopt_merge' && adopted.expectedVersion === 7,
      'exact commit/version payload',
    );
    check(
      adoption.action.input('Verified scope').requestId === adopted.requestId,
      'uncertain adoption retry keeps identity',
    );
    commit.value = 'b'.repeat(40);
    check(adoption.action.input('Verified scope').requestId !== adopted.requestId, 'changed commit is a new intent');
    const merged = triagePanel(
      { ...state, factory: { ...state.factory, tasks: [{ ...task, merge: 'a'.repeat(40) }] } },
      actions,
    );
    check(
      [...merged.querySelectorAll('button')].find((button) => button.textContent === 'Adopt external merge').disabled,
      'recorded merges use verify instead',
    );
    const owned = triagePanel(
      { ...state, factory: { ...state.factory, jobs: [{ state: 'running', taskId: task.id }] } },
      actions,
    );
    check(
      [...owned.querySelectorAll('button')].find((button) => button.textContent === 'Adopt external merge').disabled,
      'live owner fences adoption',
    );
    resetConnectionFields(document.querySelector('#editor-body'));
    check(document.querySelector('#triage-merge-commit') === null, 'custom fields retire before another control');
    const report = content.querySelector('.triage-evidence');
    report.open = true;
    check(
      content.querySelector('h4') &&
        content.querySelector('strong') &&
        content.querySelector('ul') &&
        content.querySelector('code'),
      'Markdown is formatted',
    );
    check(!content.querySelector('img') && !window.injected, 'HTML remains inert');
    result.textContent =
      'PASS: actions, commit field/focus/validation, exact identity/version, replay, ownership, merge gate, formatted Markdown and hostile text';
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`;
  }
</script>
