# Every Codex session gets its own identity and joins the team of the folder it
# runs in when you invoke $agentmesh-worker or $agentmesh-lead. Codex does not
# report MCP roots, so the host-side launcher passes that folder into the
# broker container. Requires Node.js 24 on the host.
[mcp_servers.agentmesh]
command = "node"
args = ["/absolute/path/to/malt/src/docker-mcp.ts", "--provider", "openai", "--runtime", "codex-cli"]
startup_timeout_sec = 30
# Waiting stays inside one tool call; allow up to an hour before the host cancels it.
tool_timeout_sec = 3600
