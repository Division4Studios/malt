services:
  broker:
    build:
      context: .
      args:
        MALT_SOURCE_REVISION: ${MALT_SOURCE_REVISION:-}
    image: agentmesh:local
    init: true
    depends_on:
      provider-home-init:
        condition: service_completed_successfully
    user: '${MALT_DOCKER_UID:-1000}:${MALT_DOCKER_GID:-1000}'
    pids_limit: 256
    mem_limit: ${MALT_DOCKER_MEMORY:-4g}
    cpus: ${MALT_DOCKER_CPUS:-2.0}
    restart: unless-stopped
    environment:
      HOME: ${MALT_PROVIDER_HOME:-/home/node}
      AGENTMESH_PROJECT_NAME: ${AGENTMESH_PROJECT_NAME:-agentmesh}
      AGENTMESH_LOG_LEVEL: ${AGENTMESH_LOG_LEVEL:-debug}
      AGENTMESH_HOST_ROOT: ${AGENTMESH_WORKSPACE_ROOT:-}
      AGENTMESH_MOUNT_ROOT: /workspaces
      GH_TOKEN: ${AGENTMESH_GITHUB_TOKEN:-}
      AGENTMESH_UI_PORT: ${AGENTMESH_UI_PORT:-4318}
    ports:
      - '127.0.0.1:${AGENTMESH_PORT:-4317}:4317'
      - '127.0.0.1:${AGENTMESH_UI_PORT:-4318}:4318'
    volumes:
      - type: bind
        source: ${AGENTMESH_HOME_ROOT:-.}
        target: /data
      - type: bind
        source: ${AGENTMESH_WORKSPACE_ROOT:-.}
        target: /workspaces
      - provider-home:/home/node
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Verbose diagnostics are useful while developing, but idle teams can run
    # for days. Bound container log retention; SQLite events remain durable.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4317/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

  # Initialize only the dedicated credential volume, never project bind mounts.
  # The long-lived broker and all agents still run as the selected non-root UID.
  provider-home-init:
    build: .
    image: agentmesh:local
    user: '0:0'
    network_mode: none
    read_only: true
    pids_limit: 16
    mem_limit: 128m
    cpus: 0.25
    restart: 'no'
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    environment:
      MALT_VOLUME_UID: ${MALT_DOCKER_UID:-1000}
      MALT_VOLUME_GID: ${MALT_DOCKER_GID:-1000}
    volumes:
      - provider-home:/home/node
    entrypoint: [node, --input-type=module, -e]
    command:
      - >-
        import {execFileSync} from 'node:child_process';
        const uid=process.env.MALT_VOLUME_UID, gid=process.env.MALT_VOLUME_GID;
        if(!/^\d{1,10}$$/.test(uid)||!/^\d{1,10}$$/.test(gid))throw new Error('Invalid provider volume UID/GID');
        execFileSync('chown',['-R','--no-dereference','--',uid+':'+gid,'/home/node'],{stdio:'inherit'});

volumes:
  provider-home:
